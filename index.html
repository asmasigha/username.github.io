<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BobonGram 🌸💎</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root {
            --pink-soft: #ffe4e1;
            --pink-accent: #ffb6c1;
            --pink-dark: #ff69b4;
            --gray-cold: #f5f5f7;
            --blue-gray: #e2e8f0;
            --dark-text: #2d3748;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--pink-soft);
            color: var(--dark-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            height: 92vh;
            background: white;
            border-radius: 30px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 4px solid var(--pink-accent);
        }

        /* صفحات التسجيل */
        .auth-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
            transition: all 0.3s ease;
        }

        .auth-screen.hidden { display: none; }

        .logo-area {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-area h1 {
            font-size: 2.5rem;
            color: var(--pink-dark);
            text-shadow: 2px 2px #ffe4e1;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--blue-gray);
            border-radius: 15px;
            outline: none;
            font-size: 1rem;
            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: var(--pink-dark);
            background: #fff0f5;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: var(--pink-dark);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 15px;
        }

        .btn:hover { opacity: 0.9; transform: scale(0.98); }

        .switch-auth {
            text-align: center;
            color: #718096;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* الشاشة الرئيسية والتطبيق */
        .app-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--blue-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
        }

        .app-header h2 { color: var(--pink-dark); }

        .notes-container {
            display: flex;
            gap: 15px;
            padding: 15px;
            overflow-x: auto;
            border-bottom: 1px solid var(--blue-gray);
            background: var(--gray-cold);
        }

        .note-bubble {
            flex-shrink: 0;
            width: 75px;
            text-align: center;
            position: relative;
        }

        .note-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--pink-accent);
            border: 2px solid var(--pink-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            font-size: 1.2rem;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .note-text-pop {
            position: absolute;
            top: -10px;
            background: white;
            border: 1px solid var(--pink-accent);
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            max-width: 80px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .feed {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #fafafa;
        }

        .post-card {
            background: white;
            border: 1px solid var(--blue-gray);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .post-user-ico {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--pink-dark);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
        }

        .post-content {
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 10px;
            color: var(--dark-text);
        }

        .post-time {
            font-size: 0.75rem;
            color: #a0aec0;
        }

        /* نافذة النشر السفلية */
        .creation-bar {
            padding: 15px;
            border-top: 1px solid var(--blue-gray);
            background: white;
            display: flex;
            gap: 10px;
        }

        .creation-bar input {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--blue-gray);
            border-radius: 12px;
            outline: none;
        }

        .creation-bar button {
            padding: 0 20px;
            background: var(--pink-dark);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .creation-bar button:hover { opacity: 0.9; }

        .action-btns-top {
            display: flex;
            gap: 10px;
        }

        .small-btn {
            background: var(--pink-soft);
            color: var(--pink-dark);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">

    <div id="loginScreen" class="auth-screen">
        <div class="logo-area">
            <h1>BobonGram 🌸</h1>
            <p>سجلي دخولكِ لتجربة التطبيق الحقيقي</p>
        </div>
        <div class="input-group">
            <input type="text" id="loginUsername" placeholder="اسم المستخدم (Username)">
        </div>
        <div class="input-group">
            <input type="password" id="loginPassword" placeholder="كلمة المرور">
        </div>
        <button class="btn" onclick="login()">تسجيل الدخول</button>
        <div class="switch-auth" onclick="toggleAuthScreens(false)">ماعندكش حساب؟ اصنعي حساب جديد درك</div>
    </div>

    <div id="registerScreen" class="auth-screen hidden">
        <div class="logo-area">
            <h1>حساب جديد ✨</h1>
            <p>انضمي لقاع البنات والزميلات ديريكت</p>
        </div>
        <div class="input-group">
            <input type="text" id="regFullName" placeholder="الاسم الكامل">
        </div>
        <div class="input-group">
            <input type="text" id="regUsername" placeholder="اسم مستخدم فريد (Username)">
        </div>
        <div class="input-group">
            <input type="password" id="regPassword" placeholder="كلمة المرور">
        </div>
        <button class="btn" onclick="register()">إنشاء الحساب الحقيقي</button>
        <div class="switch-auth" onclick="toggleAuthScreens(true)">عندك كونت؟ ارجعي لتسجيل الدخول</div>
    </div>

    <div class="app-header">
        <h2>BobonGram ✨</h2>
        <div class="action-btns-top">
            <button class="small-btn" onclick="openNotePrompt()">+ نوتة</button>
            <button class="small-btn" style="background:#e2e8f0; color:red;" onclick="logout()">خروج</button>
        </div>
    </div>

    <div class="notes-container" id="notesWrapper">
        </div>

    <div class="feed" id="feedWrapper">
        <div style="text-align:center; color:#a0aec0; margin-top:20px;">جاري تحميل المنشورات الحية...</div>
    </div>

    <div class="creation-bar">
        <input type="text" id="postInput" placeholder="واش راكي تخممي درك؟...">
        <button onclick="publishPost()">نشر</button>
    </div>

</div>

<script>
    // إعدادات الفايربيس الخاصة بأسما والمربوطة بالسيرفر ديريكت
    const firebaseConfig = {
        apiKey: "AIzaSyBTI56em6Haaot7wzcwDiiwdjMRL5AnSZQ",
        authDomain: "bobongram-2b0f4.firebaseapp.com",
        projectId: "bobongram-2b0f4",
        storageBucket: "bobongram-2b0f4.firebasestorage.app",
        messagingSenderId: "346774527995",
        appId: "1:346774527995:web:f31e000cf1281caa83355e",
        measurementId: "G-0RRCZQZGW9",
        databaseURL: "https://bobongram-2b0f4-default-rtdb.firebaseio.com"
    };

    // تهيئة الفايربيس
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = JSON.parse(localStorage.getItem('bobon_session')) || null;

    // فحص الجلسة عند الدخول أول مرة
    window.onload = function() {
        if(currentUser) {
            hideAuth();
            listenToData();
        }
    }

    function toggleAuthScreens(showLogin) {
        if(showLogin) {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('registerScreen').classList.add('hidden');
        } else {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('registerScreen').classList.remove('hidden');
        }
    }

    function hideAuth() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('registerScreen').classList.add('hidden');
    }

    // 1. عملية إنشاء حساب حقيقي وحفظه في السيرفر
    function register() {
        const name = document.getElementById('regFullName').value.trim();
        const username = document.getElementById('regUsername').value.trim().toLowerCase();
        const pass = document.getElementById('regPassword').value.trim();

        if(!name || !username || !pass) {
            alert('عمري قاع الفراغات أولاً يا شاطرة!');
            return;
        }

        // الفحص داخل الفايربيس إذا كان اليوزر نيم مستعمل من قبل
        db.ref('users/' + username).once('value', snapshot => {
            if(snapshot.exists()) {
                alert('هاد الـ Username راهو محجوز ومستعمل من قبل! خيري واحد آخر فريد ✨');
            } else {
                // حفظ البيانات
                const userData = { fullName: name, username: username, password: pass };
                db.ref('users/' + username).set(userData)
                .then(() => {
                    alert('تم إنشاء حسابكِ بنجاح! تقدري تسجلي دخولكِ درك 🌸');
                    toggleAuthScreens(true);
                });
            }
        });
    }

    // 2. تسجيل الدخول الحقيقي والفحص من السيرفر قبالة البنات قاع
    function login() {
        const username = document.getElementById('loginUsername').value.trim().toLowerCase();
        const pass = document.getElementById('loginPassword').value.trim();

        if(!username || !pass) {
            alert('أدخلي اسم المستخدم وكلمة المرور!');
            return;
        }

        db.ref('users/' + username).once('value', snapshot => {
            if(snapshot.exists()) {
                const user = snapshot.val();
                if(user.password === pass) {
                    currentUser = user;
                    localStorage.setItem('bobon_session', JSON.stringify(user));
                    hideAuth();
                    listenToData();
                    alert('مرحباً بيكِ في بوبون غرام الحقيقي! 💎');
                } else {
                    alert('كلمة المرور خاطئة! أعيدي المحاولة.');
                }
            } else {
                alert('هاد الحساب غير موجود! تأكدي من الاسم أو اصنعي حساب جديد.');
            }
        });
    }

    function logout() {
        localStorage.removeItem('bobon_session');
        currentUser = null;
        location.reload();
    }

    // 3. نشر بوست حقيقي في السيرفر المشترك
    function publishPost() {
        const text = document.getElementById('postInput').value.trim();
        if(!text) return;

        const postData = {
            username: currentUser.username,
            name: currentUser.fullName,
            content: text,
            timestamp: Date.now()
        };

        db.ref('posts').push(postData).then(() => {
            document.getElementById('postInput').value = '';
        });
    }

    // 4. نشر نوتة علوية سريعة تختفي وتتحدث عند الكل
    function openNotePrompt() {
        const note = prompt('اكتبي نوتة قصيرة تظهر فوق بروفايلكِ (أقل من 30 حرف):');
        if(!note || note.length > 30) {
            if(note) alert('النوتة طويلة بزاف، ديريها قصيرة وحلوة!');
            return;
        }

        db.ref('notes/' + currentUser.username).set({
            name: currentUser.fullName,
            text: note,
            timestamp: Date.now()
        });
    }

    // 5. الاستماع الحقيقي المباشر (Realtime) لقاعدة البيانات عند تغيير أي منشور أو نوتة
    function listenToData() {
        // جلب المنشورات
        db.ref('posts').orderByChild('timestamp').on('value', snapshot => {
            const feedWrapper = document.getElementById('feedWrapper');
            feedWrapper.innerHTML = '';
            
            let postsArray = [];
            snapshot.forEach(child => {
                postsArray.unshift(child.val()); // ترتيب من الأحدث للأقدم
            });

            if(postsArray.length === 0) {
                feedWrapper.innerHTML = '<div style="text-align:center; color:#a0aec0; margin-top:20px;">مكانش منشورات درك، كوني الأولى وانشري عفسة! ✨</div>';
                return;
            }

            postsArray.forEach(p => {
                const date = new Date(p.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const card = `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="post-user-ico">${p.name.substring(0,1).toUpperCase()}</div>
                            <div>
                                <div>${p.name}</div>
                                <div style="font-size:0.75rem; color:#718096; font-weight:normal;">@${p.username}</div>
                            </div>
                        </div>
                        <div class="post-content">${p.content}</div>
                        <div class="post-time">${date}</div>
                    </div>
                `;
                feedWrapper.innerHTML += card;
            });
        });

        // جلب النوتات العلوية
        db.ref('notes').on('value', snapshot => {
            const notesWrapper = document.getElementById('notesWrapper');
            notesWrapper.innerHTML = '';

            // دائماً نضع نوتة المستخدم الحالي في البداية لتسهيل رؤيتها
            let userHasNote = false;

            snapshot.forEach(child => {
                const n = child.val();
                const userKey = child.key;

                const bubble = `
                    <div class="note-bubble">
                        <div class="note-text-pop">${n.text}</div>
                        <div class="note-avatar">${n.name.substring(0,1).toUpperCase()}</div>
                        <div style="font-size:0.75rem; overflow:hidden; text-overflow:ellipsis;">${n.name.split(' ')[0]}</div>
                    </div>
                `;
                notesWrapper.innerHTML += bubble;
            });
        });
    }
</script>

</body>
</html>
